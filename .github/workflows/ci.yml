name: Pressor CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Pressor Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run repository validation
        run: |
          python tools/validate_repo.py

      - name: Run Pressor doctor
        run: |
          python pressor.py --doctor

      - name: Verify required codecs
        run: |
          ffmpeg -encoders | grep libvorbis
          ffmpeg -encoders | grep libopus

      - name: Run unit tests
        run: |
          pytest -q